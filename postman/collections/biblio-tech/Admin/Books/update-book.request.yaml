$kind: http-request
name: Update Book
method: PUT
url: '{{baseUrl}}/admin/books/{{bookId}}'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Title",
      "totalCopies": 10
    }
