$kind: http-request
name: Update Category
method: PATCH
url: '{{baseUrl}}/admin/categories/{{categoryId}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Category"
    }
